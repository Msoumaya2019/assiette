name: Android — APK et AAB

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Nom de version (ex : 0.2.0). Vide = version du pubspec."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  build:
    name: Compilation Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # Java 21, et non 17 : c'est la version avec laquelle la compilation a ete
      # validee sur le poste de developpement (JBR 21 fourni par Android Studio).
      # Le bytecode d'AGP 9.1.0 est en Java 11, donc 17 suffirait, mais faire
      # tourner l'integration continue sur une autre version de Java que celle
      # utilisee en local reintroduit une difference que l'on ne verrait qu'ici.
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ---------------------------------------------------------------------
      # Le NDK est indispensable : `path_provider_android` depend de `jni`, qui
      # compile du C++ via CMake et produit `libdartjni.so`. Sans le NDK, la
      # compilation echoue sur « Android sdkmanager did not install NDK ».
      #
      # L'image ubuntu-latest le fournit aujourd'hui, mais s'en remettre a elle
      # reviendrait a dependre d'un detail qui peut changer sans prevenir. On lit
      # donc la version exigee a la source — l'extension Gradle de Flutter — et
      # on ne l'installe que si elle manque. Une seule source de verite : celle
      # de Flutter lui-meme, jamais une valeur recopiee ici.
      # ---------------------------------------------------------------------
      - name: Verifier le NDK exige par Flutter
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          EXTENSION="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"

          if [ ! -f "$EXTENSION" ]; then
            echo "::warning::Fichier introuvable : $EXTENSION — controle du NDK ignore."
            exit 0
          fi

          NDK_REQUIS="$(sed -n 's/.*val ndkVersion: String = "\([^"]*\)".*/\1/p' "$EXTENSION" | head -1)"
          if [ -z "$NDK_REQUIS" ]; then
            echo "::warning::Version du NDK illisible dans $EXTENSION — controle ignore."
            exit 0
          fi

          echo "Flutter ${{ env.FLUTTER_VERSION }} exige le NDK $NDK_REQUIS"
          if [ -f "$ANDROID_HOME/ndk/$NDK_REQUIS/source.properties" ]; then
            echo "Deja present : $ANDROID_HOME/ndk/$NDK_REQUIS"
            exit 0
          fi

          echo "Absent : installation via sdkmanager."
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" "ndk;$NDK_REQUIS"
          test -f "$ANDROID_HOME/ndk/$NDK_REQUIS/source.properties"

      - name: Installer les dependances
        working-directory: app
        run: flutter pub get

      - name: Analyse statique
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Tests
        working-directory: app
        run: flutter test

      # ---------------------------------------------------------------------
      # Signature release.
      # Si les secrets de signature sont presents, l'APK/AAB est signe avec la
      # vraie cle de release. Sinon Flutter signe avec la cle de debug, ce qui
      # reste installable pour un usage personnel.
      # ---------------------------------------------------------------------
      - name: Preparer la signature release
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "Aucun secret de signature : compilation signee avec la cle de debug."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Secrets de signature detectes : compilation signee en release."
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK release
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }} \
            --dart-define=ANALYSIS_ENDPOINT=${{ vars.ANALYSIS_ENDPOINT }}

      - name: Compiler l'AAB release
        working-directory: app
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }} \
            --dart-define=ANALYSIS_ENDPOINT=${{ vars.ANALYSIS_ENDPOINT }}

      - name: Renommer les artefacts
        working-directory: app
        run: |
          set -euo pipefail
          SUFFIX="${{ steps.signature.outputs.signed == 'true' && 'signe' || 'debug-key' }}"
          VERSION="${GITHUB_REF_NAME//\//-}"
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "../artifacts/app-release-${VERSION}-${SUFFIX}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../artifacts/app-release-${VERSION}-${SUFFIX}.aab"
          ls -lh ../artifacts

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publier l'AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-android
          path: artifacts/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Nettoyer les fichiers de signature
        if: always()
        run: rm -f app/android/app/upload-keystore.jks app/android/key.properties

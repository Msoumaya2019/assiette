name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sans cette declaration, le jeton recoit les droits par defaut du depot, plus
# larges que ce dont ces travaux ont besoin. Ils ne font que lire le code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse-et-tests:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Verifier l'absence de secrets commites
        run: python3 tools/check_no_secrets.py

      - name: Verifier la synchronisation des prompts
        run: python3 tools/check_prompt_sync.py

      # `git ls-files --eol` est le seul endroit ou l'on voit qu'une copie de
      # travail viole `.gitattributes`. Ici, le cote indexe compte : un clone
      # frais respecte toujours l'attribut, donc un blob CRLF dans l'index est
      # le seul defaut visible depuis un executeur Linux — et il voyage partout.
      - name: Verifier les fins de ligne
        run: python3 tools/check_fins_de_ligne.py

      # Le projet iOS ne peut pas etre compile sous Windows. Ce controle lit les
      # fichiers du projet sans Xcode : icones, storyboard, Info.plist, cible de
      # deploiement, Podfile. Il ne remplace pas une compilation, mais il attrape
      # la configuration avant qu'elle ne coute un cycle de 20 minutes.
      - name: Verifier la coherence du projet iOS
        run: python3 tools/check_ios.py

      # Les adresses annoncees par l'application sortent dans le binaire : lien
      # d'assistance, identifiant Open Food Facts. Elles pointaient vers un depot
      # inexistant, et rien ne le signalait.
      - name: Verifier les adresses du depot
        run: python3 tools/check_adresses_du_depot.py

      # Le schema local et le schema serveur portent la meme verite sans pouvoir
      # se lire. Le 21 septembre, le serveur etait en retard de deux versions :
      # ni portions, ni pesees, ni mensurations. Rien ne le signalait, et le jour
      # ou la synchronisation aurait ete branchee, tout le suivi du poids aurait
      # ete perdu en silence. Ce controle tient l'accord dans les deux sens.
      - name: Verifier l'accord des schemas local et serveur
        run: python3 tools/check_migration_serveur.py

      # `tools/version_build.sh` decide de la version inscrite dans l'APK, l'AAB
      # et l'IPA. Il ne s'execute en vrai que dans les flux de publication, sur un
      # tag — donc sur une version qu'on ne peut pas rejouer sans en creer un
      # autre. Une regression de sa logique n'apparaitrait qu'a ce moment-la. Ici,
      # elle tombe a chaque push, en quelques secondes.
      - name: Verifier la logique de version publiee
        run: python3 tools/verifier_version_build.py

      - name: Installer les dependances
        working-directory: app
        run: flutter pub get

      - name: Verifier le formatage
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires et de widgets
        working-directory: app
        run: flutter test --coverage

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  serveur:
    name: Serveur (Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Deno
        uses: denoland/setup-deno@v2
        with:
          # Deno 2 : `Deno.serve` y est stable, aucun indicateur supplementaire
          # n'est necessaire. C'est aussi la version des Edge Functions Supabase.
          deno-version: v2.x

      - name: Verification des types
        run: deno check supabase/functions/analyze-meal/index.ts supabase/functions/analyze-label/index.ts

      # Les tests interrogent le gestionnaire par de vraies requetes HTTP : ils
      # ont besoin d'ouvrir un port, d'ou `--allow-net`, et de definir une cle
      # factice pour franchir le controle de configuration, d'ou `--allow-env`.
      # Aucun appel au fournisseur n'est declenche.
      - name: Tests du serveur
        run: deno test --allow-net --allow-env tests/

  validite-workflows:
    name: Validation des workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # `setup-python` plutot que le python3 du systeme : sur Ubuntu 24.04, le
      # python du systeme est « externally managed » et refuse toute
      # installation de paquet. Le controle exige PyYAML pour analyser le YAML —
      # sans lui il s'arrete en erreur, et non en silence, parce qu'une analyse
      # structurelle deguisee en validation complete est un vert trompeur.
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Verifier la syntaxe des workflows
        run: python tools/check_workflows.py

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # `setup-node` epingle l'interpreteur qui execute le script, pour que le
      # verdict ne depende pas du Node livre par l'executeur.
      #
      # A ne pas confondre avec l'avertissement de depreciation Node 20 : mesure
      # faite, il nomme les actions elles-memes (`actions/checkout@v4`,
      # `actions/setup-node@v4`) et apparait dans **toutes** les taches, y
      # compris celles qui n'ont aucun Node. Ce choix ne le fait donc ni
      # apparaitre ni disparaitre — il n'est pas la pour ca.
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PGlite est un PostgreSQL complet compile en WebAssembly : il execute du
      # vrai SQL — roles, GRANT, politiques, transactions — sans Docker et sans
      # service. Le paquet n'est pas vendore dans le depot, d'ou cette
      # installation.
      #
      # La version est epinglee, et c'est deliberé : un controle dont le verdict
      # peut changer parce qu'une dependance a monte ne mesure plus la meme
      # chose. Une montee se decide, elle ne se subit pas.
      - name: Installer PGlite
        run: npm install --no-save @electric-sql/pglite@0.5.8

      # Ce que ce controle etablit, et qu'aucun autre ne peut voir : que le SQL
      # **s'execute**. Une colonne mal nommee, un `references` vers une table
      # absente, une parenthese en trop : tout cela passe une lecture attentive
      # et echoue ici.
      #
      # Il verifie aussi que les deux migrations se **rejouent**, et que les
      # trois tables ajoutees filtrent par utilisateur — y compris du cote
      # ecriture, la moitie qu'on oublie.
      - name: Eprouver les migrations sur un vrai PostgreSQL
        run: node tools/eprouver_migration_sur_postgres.mjs
